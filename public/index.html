<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat | Тёмная тема</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #4a1e6d;
            --accent-light: #6a2c9c;
            --text: #e6e6e6;
            --text-secondary: #b3b3b3;
            --user-msg: #4a1e6d;
            --ai-msg: #2d3748;
            --shadow: rgba(0, 0, 0, 0.5);
            --glow: rgba(106, 44, 156, 0.3);
            --error: #e74c3c;
            --success: #2ecc71;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Страница авторизации */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }
        
        .auth-box {
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 20px 40px var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .auth-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff, var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .auth-step {
            display: none;
        }
        
        .auth-step.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-light);
            box-shadow: 0 0 0 2px var(--glow);
        }
        
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--glow);
        }
        
        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
        }
        
        .auth-link a {
            color: var(--accent-light);
            text-decoration: none;
            cursor: pointer;
        }
        
        .error-message {
            color: var(--error);
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
        
        .success-message {
            color: var(--success);
            font-size: 0.9rem;
            text-align: center;
            margin-top: 10px;
        }
        
        /* Основное приложение */
        .app-container {
            display: none;
            height: 100vh;
            width: 100vw;
            position: relative;
        }
        
        /* Боковая панель */
        .sidebar {
            width: 280px;
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 5px 0 15px var(--shadow);
            z-index: 10;
        }
        
        .logo {
            display: flex;
            align-items: center;
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            box-shadow: 0 4px 10px var(--glow);
        }
        
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #b3b3b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .new-chat-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            margin: 0 20px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--glow);
        }
        
        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--glow);
        }
        
        .new-chat-btn svg {
            margin-right: 8px;
        }
        
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
        }
        
        .history-item {
            padding: 12px 16px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }
        
        .history-item.active {
            background: rgba(106, 44, 156, 0.2);
            color: var(--text);
        }
        
        .history-item-content {
            display: flex;
            align-items: center;
            flex: 1;
        }
        
        .history-item svg {
            margin-right: 10px;
            opacity: 0.7;
        }
        
        .delete-chat {
            opacity: 0;
            transition: opacity 0.2s ease;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }
        
        .history-item:hover .delete-chat {
            opacity: 1;
        }
        
        .delete-chat:hover {
            color: var(--error);
            background: rgba(231, 76, 60, 0.1);
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .user-info-main {
            display: flex;
            align-items: center;
            flex: 1;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: bold;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .user-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .logout-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        
        .logout-btn:hover {
            color: var(--error);
            background: rgba(231, 76, 60, 0.1);
        }
        
        /* Основная область чата */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .chat-header {
            padding: 20px 30px;
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 10px var(--shadow);
            z-index: 5;
        }
        
        .model-info {
            display: flex;
            align-items: center;
        }
        
        .model-badge {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-right: 15px;
            box-shadow: 0 2px 8px var(--glow);
        }
        
        .model-name {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .chat-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }
        
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            background: radial-gradient(circle at top right, rgba(74, 30, 109, 0.1), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(22, 33, 62, 0.1), transparent 50%);
        }
        
        .message {
            max-width: 70%;
            padding: 18px 22px;
            border-radius: 18px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.4s ease-out;
            box-shadow: 0 4px 15px var(--shadow);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--user-msg), #5a2a84);
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 15px var(--glow);
        }
        
        .ai-message {
            align-self: flex-start;
            background: rgba(45, 55, 72, 0.8);
            backdrop-filter: blur(5px);
            color: var(--text);
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1rem;
        }
        
        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 8px;
            text-align: right;
        }
        
        .typing-indicator {
            align-self: flex-start;
            background: rgba(45, 55, 72, 0.8);
            backdrop-filter: blur(5px);
            color: var(--text-secondary);
            padding: 18px 22px;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px var(--shadow);
        }
        
        .typing-dots {
            display: inline-flex;
            align-items: center;
        }
        
        .typing-dots span {
            height: 8px;
            width: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            display: inline-block;
            margin: 0 3px;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .chat-input-container {
            padding: 25px 30px;
            background: #ffffff00;
            display: flex;
            gap: 15px;
            z-index: 5;
            justify-content: center;
            align-items: center;
        }
        
        .chat-input {
            width: 25%;
            padding: 16px 22px;
            border-radius: 18px;
            border: 1px solid rgba(101, 78, 163, 0.281);
            font-size: 15px;
            resize: none;
            max-height: 120px;
            overflow-y: hidden; /* Убираем скролл */
            transition: all 0.3s ease;
            background: rgba(13, 15, 35, 0.089);
            color: #fff;
            height: 50px;
            min-height: 50px;
            display: center;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(20px);
        }

        .chat-input:focus {
            outline: none;
            border-color: #7a64ff;
            box-shadow: 0 0 20px rgba(122, 100, 255, 0.3);
            width: 75%;
            background: rgba(13, 15, 35, 0.9);
        }

        .chat-input:hover {
            border-color: #7b64ff;
            background: rgba(13, 15, 35, 0.089);
            width: 75%;
        }
        
        .chat-input::placeholder {
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .chat-input:focus::placeholder,
        .chat-input:hover::placeholder {
            color: #7a64ff;
        }
        
        .send-button {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            border: none;
            border-radius: 16px;
            width: 56px;
            height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--glow);
        }
        
        .stop-button {
            background: linear-gradient(135deg, var(--error), #c0392b);
        }
        
        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--glow);
        }
        
        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 10px rgba(106, 44, 156, 0.2);
        }
        
        .api-status {
            position: absolute;
            bottom: 10px;
            right: 30px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: rgba(22, 33, 62, 0.7);
            padding: 6px 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }
        
        /* Анимированный фон */
        .background-effects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .floating-element {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-light), transparent);
            opacity: 0.1;
            animation: float 20s infinite linear;
        }
        
        .floating-element:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-duration: 25s;
        }
        
        .floating-element:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-duration: 20s;
            animation-direction: reverse;
        }
        
        .floating-element:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 10%;
            animation-duration: 15s;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            
            .logo-text, .new-chat-btn span, .history-item span, .user-info, .delete-chat {
                display: none;
            }
            
            .logo {
                justify-content: center;
                padding: 0 0 20px;
            }
            
            .logo-icon {
                margin-right: 0;
            }
            
            .new-chat-btn {
                padding: 14px;
                margin: 0 10px 20px;
            }
            
            .history-item {
                justify-content: center;
                padding: 12px;
            }
            
            .history-item svg {
                margin-right: 0;
            }
            
            .user-profile {
                justify-content: center;
            }
            
            .avatar {
                margin-right: 0;
            }
            
            .message {
                max-width: 85%;
            }
        }
        
        /* Скрытие скроллбара */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }
        
        .chat-history::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-history::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
        }
        
        .chat-history::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- Страница авторизации -->
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <h1 class="auth-title">Gemini Chat</h1>
            
            <!-- Шаг 1: Регистрация/Вход -->
            <div class="auth-step active" id="step1">
                <div class="form-group">
                    <label class="form-label">Имя</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="Введите ваше имя">
                    <div class="error-message" id="nameError"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="emailInput" placeholder="Введите ваш email">
                    <div class="error-message" id="emailError"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-input" id="passwordInput" placeholder="Создайте пароль">
                    <div class="error-message" id="passwordError"></div>
                </div>
                <button class="auth-btn" id="continueBtn">Продолжить</button>
                <div class="auth-link">
                    Уже есть аккаунт? <a id="switchToLogin">Войти</a>
                </div>
            </div>
            
            <!-- Шаг 2: Подтверждение кода -->
            <div class="auth-step" id="step2">
                <div class="form-group">
                    <label class="form-label">Код подтверждения</label>
                    <input type="text" class="form-input" id="codeInput" placeholder="Введите код из email" maxlength="6">
                    <div class="error-message" id="codeError"></div>
                </div>
                <button class="auth-btn" id="verifyBtn">Подтвердить</button>
                <div class="auth-link">
                    <a id="resendCode">Отправить код повторно</a>
                </div>
            </div>
            
            <!-- Шаг 3: Успешная регистрация -->
            <div class="auth-step" id="step3">
                <div class="success-message">
                    <h3>Регистрация завершена!</h3>
                    <p>Добро пожаловать в Gemini Chat!</p>
                </div>
                <button class="auth-btn" id="startChatBtn">Начать общение</button>
            </div>
        </div>
    </div>

    <!-- Основное приложение -->
    <div class="app-container" id="appContainer">
        <!-- Боковая панель -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L13.09 8.26L20 9L14.55 13.47L16.18 20L12 16.77L7.82 20L9.45 13.47L4 9L10.91 8.26L12 2Z" fill="white"/>
                    </svg>
                </div>
                <div class="logo-text">Gemini</div>
            </div>
            
            <button class="new-chat-btn" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V20M4 12H20" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Новый чат</span>
            </button>
            
            <div class="chat-history" id="chatHistory">
                <!-- История чатов будет загружаться здесь -->
            </div>
            
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-info-main">
                        <div class="avatar" id="userAvatar">U</div>
                        <div class="user-info">
                            <div class="user-name" id="userName">Пользователь</div>
                            <div class="user-status">Online</div>
                        </div>
                    </div>
                    <button class="logout-btn" id="logoutBtn" title="Выйти">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9M16 17L21 12M21 12L16 7M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Основная область чата -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="model-info">
                    <div class="model-badge">PRO</div>
                    <div class="model-name">Gemini 2.5 Flash</div>
                </div>
                <div class="chat-actions">
                    <button class="action-btn" id="clearChatBtn">Очистить чат</button>
                    <button class="action-btn" id="exportChatBtn">Экспорт</button>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message ai-message">
                    <div class="message-content">Привет! Я Google Gemini. Готов помочь вам с любыми вопросами!</div>
                    <div class="message-time">только что</div>
                </div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                Gemini печатает...
            </div>
            
            <div class="chat-input-container">
                <textarea class="chat-input" id="chatInput" placeholder="Введите ваше сообщение..." autocomplete="off" rows="1"></textarea>
                <button class="send-button" id="sendButton">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            
            <div class="api-status" id="apiStatus">
                Статус: <span id="statusText">Готов к работе</span>
            </div>
        </div>
        
        <!-- Анимированный фон -->
        <div class="background-effects">
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
        </div>
    </div>

    <script>
        // Конфигурация
        const API_BASE_URL = 'https://chatfuzionai.onrender.com';
        const API_KEY = 'AIzaSyCJchS_oCwhbMmjBMCm2oN45W_CQFgI5ZE';
        
        // Состояние приложения
        let currentUser = null;
        let currentChatId = null;
        let chats = [];
        let isGenerating = false;
        let abortController = null;
        
        // Элементы DOM
        const authContainer = document.getElementById('authContainer');
        const appContainer = document.getElementById('appContainer');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusText = document.getElementById('statusText');
        const chatHistory = document.getElementById('chatHistory');
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
            initEventListeners();
        });
        
        // Проверка статуса авторизации
        function checkAuthStatus() {
            const token = localStorage.getItem('authToken');
            const userData = localStorage.getItem('userData');
            
            if (token && userData) {
                currentUser = JSON.parse(userData);
                showApp();
                loadUserChats();
            } else {
                showAuth();
            }
        }
        
        // Показать страницу авторизации
        function showAuth() {
            authContainer.style.display = 'flex';
            appContainer.style.display = 'none';
        }
        
        // Показать основное приложение
        function showApp() {
            authContainer.style.display = 'none';
            appContainer.style.display = 'flex';
            userName.textContent = currentUser.name;
            userAvatar.textContent = currentUser.name.charAt(0).toUpperCase();
        }
        
        // Инициализация обработчиков событий
        function initEventListeners() {
            // Авторизация
            document.getElementById('continueBtn').addEventListener('click', handleAuthContinue);
            document.getElementById('switchToLogin').addEventListener('click', switchToLogin);
            document.getElementById('verifyBtn').addEventListener('click', handleVerifyCode);
            document.getElementById('resendCode').addEventListener('click', resendCode);
            document.getElementById('startChatBtn').addEventListener('click', showApp);
            
            // Чат
            sendButton.addEventListener('click', sendMessage);
            chatInput.addEventListener('keypress', handleKeyPress);
            document.getElementById('newChatBtn').addEventListener('click', createNewChat);
            document.getElementById('clearChatBtn').addEventListener('click', clearCurrentChat);
            document.getElementById('exportChatBtn').addEventListener('click', exportChat);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            
            // Автоматическое изменение высоты textarea
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
        }
        
        // Обработка авторизации
        async function handleAuthContinue() {
            const name = document.getElementById('nameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            
            if (!validateAuthInput(name, email, password)) return;
            
            try {
                // Здесь будет запрос к вашему серверу для отправки кода
                const response = await fetch(`${API_BASE_URL}/auth/send-code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, password })
                });
                
                if (response.ok) {
                    showStep(2);
                    // Сохраняем временные данные
                    sessionStorage.setItem('tempAuth', JSON.stringify({ name, email, password }));
                } else {
                    showError('emailError', 'Ошибка при отправке кода');
                }
            } catch (error) {
                // Для демонстрации - эмуляция успешной отправки
                showStep(2);
                sessionStorage.setItem('tempAuth', JSON.stringify({ name, email, password }));
            }
        }
        
        // Подтверждение кода
        async function handleVerifyCode() {
            const code = document.getElementById('codeInput').value.trim();
            
            if (!code || code.length !== 6) {
                showError('codeError', 'Введите корректный 6-значный код');
                return;
            }
            
            try {
                const tempAuth = JSON.parse(sessionStorage.getItem('tempAuth'));
                
                // Здесь будет запрос к вашему серверу для проверки кода
                const response = await fetch(`${API_BASE_URL}/auth/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ...tempAuth,
                        code: code
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    // Сохраняем токен и данные пользователя
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userData', JSON.stringify(data.user));
                    currentUser = data.user;
                    showStep(3);
                } else {
                    showError('codeError', 'Неверный код подтверждения');
                }
            } catch (error) {
                // Для демонстрации - эмуляция успешной регистрации
                const tempAuth = JSON.parse(sessionStorage.getItem('tempAuth'));
                const mockUser = {
                    id: Date.now(),
                    name: tempAuth.name,
                    email: tempAuth.email
                };
                localStorage.setItem('authToken', 'mock-token-' + Date.now());
                localStorage.setItem('userData', JSON.stringify(mockUser));
                currentUser = mockUser;
                showStep(3);
            }
        }
        
        // Валидация ввода авторизации
        function validateAuthInput(name, email, password) {
            let isValid = true;
            
            if (!name) {
                showError('nameError', 'Введите ваше имя');
                isValid = false;
            } else {
                hideError('nameError');
            }
            
            if (!email || !isValidEmail(email)) {
                showError('emailError', 'Введите корректный email');
                isValid = false;
            } else {
                hideError('emailError');
            }
            
            if (!password || password.length < 6) {
                showError('passwordError', 'Пароль должен содержать минимум 6 символов');
                isValid = false;
            } else {
                hideError('passwordError');
            }
            
            return isValid;
        }
        
        // Проверка email
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
        
        // Показать ошибку
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }
        
        // Скрыть ошибку
        function hideError(elementId) {
            const element = document.getElementById(elementId);
            element.style.display = 'none';
        }
        
        // Переключение между шагами
        function showStep(stepNumber) {
            document.querySelectorAll('.auth-step').forEach(step => {
                step.classList.remove('active');
            });
            document.getElementById(`step${stepNumber}`).classList.add('active');
        }
        
        // Переключение на вход
        function switchToLogin() {
            // Реализация входа (аналогична регистрации)
            alert('Функция входа будет реализована в следующей версии');
        }
        
        // Повторная отправка кода
        function resendCode() {
            alert('Код отправлен повторно!');
        }
        
        // Выход из системы
        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userData');
            currentUser = null;
            showAuth();
        }
        
        // Загрузка чатов пользователя
        async function loadUserChats() {
            try {
                // Здесь будет запрос к вашему серверу для загрузки чатов
                const response = await fetch(`${API_BASE_URL}/chats`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    }
                });
                
                // Для демонстрации используем моковые данные
                chats = [
                    { id: 1, title: 'Обсуждение ИИ', createdAt: new Date() },
                    { id: 2, title: 'Помощь с кодом', createdAt: new Date() },
                    { id: 3, title: 'Идеи для проекта', createdAt: new Date() }
                ];
                
                renderChatHistory();
            } catch (error) {
                console.error('Ошибка загрузки чатов:', error);
            }
        }
        
        // Отображение истории чатов
        function renderChatHistory() {
            chatHistory.innerHTML = '';
            chats.forEach(chat => {
                const chatElement = document.createElement('div');
                chatElement.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                chatElement.innerHTML = `
                    <div class="history-item-content">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>${chat.title}</span>
                    </div>
                    <button class="delete-chat" data-chat-id="${chat.id}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 6H5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                `;
                chatElement.addEventListener('click', () => loadChat(chat.id));
                chatHistory.appendChild(chatElement);
            });
        }
        
        // Создание нового чата
        function createNewChat() {
            currentChatId = Date.now();
            chats.unshift({
                id: currentChatId,
                title: 'Новый чат',
                createdAt: new Date(),
                messages: []
            });
            renderChatHistory();
            clearChatMessages();
            addMessage('Привет! Я Google Gemini. Готов помочь вам с любыми вопросами!', false);
        }
        
        // Загрузка чата
        function loadChat(chatId) {
            currentChatId = chatId;
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                clearChatMessages();
                // Загрузка сообщений чата
                if (chat.messages) {
                    chat.messages.forEach(msg => {
                        addMessage(msg.content, msg.role === 'user');
                    });
                } else {
                    addMessage('Привет! Я Google Gemini. Готов помочь вам с любыми вопросами!', false);
                }
                renderChatHistory();
            }
        }
        
        // Очистка текущего чата
        function clearCurrentChat() {
            if (confirm('Вы уверены, что хотите очистить текущий чат?')) {
                clearChatMessages();
                addMessage('Чат очищен. Чем могу помочь?', false);
            }
        }
        
        // Экспорт чата
        function exportChat() {
            const chatContent = Array.from(chatMessages.children)
                .map(msg => {
                    const isUser = msg.classList.contains('user-message');
                    const content = msg.querySelector('.message-content').textContent;
                    return `${isUser ? 'Вы' : 'Gemini'}: ${content}`;
                })
                .join('\n\n');
            
            const blob = new Blob([chatContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gemini-chat-${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Обработка нажатия клавиш
        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        // Отправка сообщения
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || isGenerating) return;
            
            // Очистка поля ввода
            chatInput.value = '';
            chatInput.style.height = '50px';
            
            // Добавление сообщения пользователя
            addMessage(message, true);
            
            // Показать индикатор печати
            showTypingIndicator();
            
            // Сменить кнопку на "Стоп"
            setStopButton();
            
            // Отключить поле ввода
            chatInput.disabled = true;
            isGenerating = true;
            
            try {
                // Создаем AbortController для возможности отмены
                abortController = new AbortController();
                
                // Обновление статуса
                statusText.textContent = 'Отправка в Gemini...';
                
                // Подготовка данных для API
                const requestData = {
                    contents: [
                        {
                            parts: [
                                { text: message }
                            ]
                        }
                    ],
                    generationConfig: {
                        temperature: 0.7,
                        topK: 40,
                        topP: 0.95,
                        maxOutputTokens: 1024,
                    }
                };
                
                // URL для Gemini API
                const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;
                
                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData),
                    signal: abortController.signal
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                hideTypingIndicator();
                
                // Извлечение текста ответа
                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                    const responseText = data.candidates[0].content.parts[0].text;
                    addMessage(responseText, false);
                    statusText.textContent = 'Ответ получен';
                    
                    // Сохранение чата на сервер
                    await saveChatToServer();
                } else {
                    throw new Error('Неверный формат ответа от API');
                }
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    hideTypingIndicator();
                    addMessage('Генерация остановлена пользователем', false);
                    statusText.textContent = 'Остановлено';
                } else {
                    console.error('Ошибка при отправке сообщения:', error);
                    hideTypingIndicator();
                    addMessage('Ошибка при обращении к Gemini API: ' + error.message, false);
                    statusText.textContent = 'Ошибка API';
                }
            } finally {
                // Восстановление интерфейса
                setSendButton();
                chatInput.disabled = false;
                isGenerating = false;
                abortController = null;
            }
        }
        
        // Остановка генерации
        function stopGeneration() {
            if (abortController) {
                abortController.abort();
            }
        }
        
        // Установка кнопки "Отправить"
        function setSendButton() {
            sendButton.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `;
            sendButton.classList.remove('stop-button');
            sendButton.removeEventListener('click', stopGeneration);
            sendButton.addEventListener('click', sendMessage);
        }
        
        // Установка кнопки "Стоп"
        function setStopButton() {
            sendButton.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="6" width="12" height="12" rx="1" fill="white"/>
                </svg>
            `;
            sendButton.classList.add('stop-button');
            sendButton.removeEventListener('click', sendMessage);
            sendButton.addEventListener('click', stopGeneration);
        }
        
        // Добавление сообщения в чат
        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.appendChild(contentDiv);
            messageDiv.appendChild(timeDiv);
            chatMessages.appendChild(messageDiv);
            
            // Прокрутка вниз
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Показать индикатор печати
        function showTypingIndicator() {
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Скрыть индикатор печати
        function hideTypingIndicator() {
            typingIndicator.style.display = 'none';
        }
        
        // Очистка сообщений чата
        function clearChatMessages() {
            chatMessages.innerHTML = '';
        }
        
        // Сохранение чата на сервер
        async function saveChatToServer() {
            if (!currentUser || !currentChatId) return;
            
            try {
                // Здесь будет запрос к вашему серверу для сохранения чата
                await fetch(`${API_BASE_URL}/chats/${currentChatId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    },
                    body: JSON.stringify({
                        messages: getCurrentChatMessages()
                    })
                });
            } catch (error) {
                console.error('Ошибка сохранения чата:', error);
            }
        }
        
        // Получение текущих сообщений чата
        function getCurrentChatMessages() {
            return Array.from(chatMessages.children).map(msg => {
                const isUser = msg.classList.contains('user-message');
                const content = msg.querySelector('.message-content').textContent;
                return {
                    role: isUser ? 'user' : 'assistant',
                    content: content
                };
            });
        }
        
        // Фокус на поле ввода при загрузке
        chatInput.focus();
    </script>
</body>
</html>
